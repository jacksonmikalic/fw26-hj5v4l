:root {

  --serif: Georgia, "Times New Roman", Times, serif;
}

  --accent: #D08A7C; --accent-soft: #2A2335; --chip: #222D47; --chip-on: #ECE6DA; --chip-on-fg: #121A2B; --warn: #D9B866; --kid-soft: #1F2A44;

:root[data-theme="dark"] {
  --bg: #121A2B; --surface: #1A2338; --ink: #ECE6DA; --body: #D9D3C8; --muted: #9A9AA6; --rule: #2C3753;
  --accent: #D08A7C; --accent-soft: #2A2335; --chip: #222D47; --chip-on: #ECE6DA; --chip-on-fg: #121A2B; --warn: #D9B866; --kid-soft: #1F2A44;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--body); font: 16px/1.55 var(--serif); margin: 0 }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px }
a { color: var(--accent) }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.mark { font-weight: bold; letter-spacing: .14em; font-size: 12px; color: var(--ink) }
.mark b { color: var(--accent); font-weight: normal; margin: 0 .35em }
h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; color: var(--ink); margin: 10px 0 8px; text-wrap: balance }
.lede { max-width: 62ch; margin: 0 0 6px; color: var(--body) }
.built { color: var(--muted); font-size: 13px; font-style: italic; margin: 0 }
.hr { border: 0; border-top: 1px solid var(--accent); width: 72px; margin: 18px 0 0 }

.bar { background: var(--bg);

.tabs { display: flex; gap: 4px; flex-wrap: wrap }
.tab { font: inherit; font-size: 15px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
  padding: 4px 10px 6px; cursor: pointer }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: bold }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.chip { font: inherit; font-size: 13px; background: var(--chip); color: var(--ink); border: 1px solid transparent;
  border-radius: 999px; padding: 4px 11px; cursor: pointer; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg) }
.chip .n { opacity: .65; font-variant-numeric: tabular-nums; margin-left: 3px }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.ctrl input[type=date] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; min-width: 0 }
#dates label { font-size: 14px; color: var(--muted) }
.ctrl input[type=search], .ctrl select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);

.ctrl input[type=search] { flex: 1 1 180px }
.cnt { color: var(--muted); font-variant-numeric: tabular-nums }
.ctrl label { font-size: 14px; color: var(--ink); display: inline-flex; gap: 5px; align-items: center; cursor: pointer }
.weeknav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin }
.weeknav a { font-size: 13px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);

.weeknav a.tg { border-color: var(--accent); color: var(--accent) }

.week { padding-top: 34px; scroll-margin-top: 12px }
.kids .weekly a { color: var(--ink); cursor: pointer }
.week > h2 { font-size: 26px; color: var(--ink); margin: 0; text-wrap: balance }
.week .sub { color: var(--muted); font-size: 14px; margin: 2px 0 14px; font-variant-numeric: tabular-nums }

.picks ol { margin: 0; padding-left: 20px; display: grid; gap: 6px }

.kids { background: var(--kid-soft); border-left: 3px solid var(--ink); padding: 12px 16px; margin: 0 0 18px; border-radius: 0 6px 6px 0 }
.kids h3 { margin: 0 0 6px; font-size: 15px; color: var(--ink) }
.kids ul { margin: 0; padding-left: 18px; display: grid; gap: 5px }
.kids li { color: var(--ink); font-size: 15px }
.kids li span { color: var(--body); font-size: 14px }

.kidtag { color: var(--ink); font-style: italic }
.day { margin: 0 0 6px }
.day h3 { font-size: 16px; color: var(--ink); margin: 18px 0 4px; display: flex; gap: 8px; align-items: baseline }

.day h3.weekend { font-size: 18px }

.ev { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--rule) }
.ev:first-of-type { border-top: 0 }
.ev .main { min-width: 0 }

.empty { color: var(--muted); font-style: italic; padding: 28px 0 }
#actrow { display: grid; gap: 4px }
.actlab { font-size: 13px; color: var(--muted); font-style: italic }
.acts { display: flex; flex-wrap: wrap; gap: 6px }

.alsoseason > h2 { font-size: 18px; color: var(--ink); margin: 0 }

.fbody { display: grid; gap: 10px; padding-top: 10px }
.foot a.act { color: var(--ink) }
#totop { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 9; font: inherit; font-size: 14px;

.note { font-size: 14px; color: var(--muted); max-width: 64ch; margin: 18px 0 0 }
@media (max-width: 520px) { .ev h4 { font-size: 16px } .week > h2 { font-size: 22px } }

</style>
</head>

g at Lambertville and New Hope, with Bowman's Tower visible from the South Overlook. Local legend says Washington scouted from here.","best_time":"Late Oct; late afternoon light on the river; go early on weekends, it is popular","tips":"Trailhead at 20 George Washington Rd, Lambertville. Starts as a wide gravel path that turns to dirt, so carrier rather than stroller. Short enough for a nap window. Pair with lunch in Lambertville or a pint at Odd Bird Brewing in Stockton.","fee":"free","source_url":"https://www.njhiking.com/goat-hill-overlook/","confidence":"Medium","id":"n-goat-hill-overlook"},{"name":"Delaware Canal towpath: New Hope to Centre Bridge and Virginia Forrest","kind":"towpath-walk","park":"Delaware Canal State Park (D&L Trail)","town":"New Hope / Solebury","county":"Bucks","state":"PA","length":"4.7 mi one way (Virginia Forrest Recreation Area to New Hope)","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Tree lined canal between the river and the bluffs, with leaves reflecting in the still canal water and the river showing through the trees.","best_time":"Late Oct to early Nov; mornings before New Hope gets busy","tips":"Section is listed as complete, open and improved. Heads up: the towpath under the Union Mills Bridge at mile 23.7 (Water Works, just south of New Hope) is closed until further notice with a signed detour onto Main St, so start in New Hope and head north. Gravel towpath, fine for a sturdy stroller. Pair with Manoff Market Gardens or Solebury Orchards.","fee":"free","source_url":"https://delawareandlehigh.org/map/trail-section/virginia-forest-recreation-area-trailhead-new-hope/","confidence":"High","id":"n-delaware-canal-towpath-new-hope-to-centre-bridge-and-virgi"},{"name":"Bull's Island and the Lumberville footbridge","kind":"towpath-walk","park":"Bulls Island Recreation Area (D&R Canal State Park) and Delaware Canal State Park","town":"Stockton (Bull's Island) / Lumberville PA","county":"Hunterdon","state":"NJ","length":"Natural Area Trail 0.82 mi; White Oak Trail 1.1 mi; Inlet Trail 1.3 mi paved; footbridge across the river to the PA towpath","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"A forested island between the feeder canal and the Delaware, connected by a pedestrian bridge to Lumberville, PA. You can stand mid river and look up and down a valley full of color, then loop back on the towpaths.","best_time":"Late Oct; weekday or early weekend mornings","tips":"Park office, picnic area, playground and restrooms on the island (2185 Daniel Bray Hwy, Stockton). The paved Inlet Trail is the easy stroller option. The Lumberville section of the PA towpath reopened after the aqueduct repair. Pair with Odd Bird Brewing in Stockton or Federal Twist Vineyard up the road.","fee":"unknown","source_url":"https://dep.nj.gov/wp-content/uploads/parksandforests/bullsisland-area.pdf","confidence":"High","id":"n-bull-s-island-and-the-lumberville-footbridge"},{"name":"River Road (PA Route 32) scenic drive","kind":"scenic-drive","park":"Delaware River corridor","town":"Yardley to Upper Black Eddy","county":"Bucks","state":"PA","length":null,"difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Two lanes squeezed between the canal, the river and wooded bluffs; foliage at eye level the whole way, with stone villages (Lumberville, Point Pleasant, Erwinna) every few miles.","best_time":"Late Oct; weekday or early Sunday to avoid New Hope traffic","tips":"Suggested route: Washington Crossing Historic Park (free grounds) then Bowman's Hill Tower, coffee and a stroll in New Hope, north on 32 past Centre Bridge to Lumberville (walk the footbridge to Bull's Island), Point Pleasant for the High Rocks detour on Tory Rd, then Ringing Rocks near Upper Black Eddy. Farm stop: Trauger's Farm Market in Kintnersville at the top. Cross the river at Frenchtown or Milford and come home on NJ Route 29.","fee":"free","source_url":"https://www.visitbuckscounty.com/blog/stories/post/top-10-ways-to-view-fall-foliage/","confidence":"Medium","id":"n-river-road-pa-route-32-scenic-drive"},{"name":"Baldpate Mountain Summit Trail","kind":"hike","park":"Ted Stiles Preserve at Baldpate Mountain (Mercer County Park Commission)","town":"Titusville (Hopewell Twp)","county":"Mercer","state":"NJ","length":"Summit Trail climbs 400+ ft; about 2 mi of ridge trail plus 12 mi of marked trails","difficulty":"moderate","stroller":"no","carrier_ok":true,"why_fall":"Highest point in Mercer County, with a grassy summit view of the Delaware valley and, on a clear day, the Philadelphia skyline. The ridge is the township's largest forest and an Audubon Important Bird Area.","best_time":"Late Oct; clear mornings for the long view","tips":"Gravel lot for about 20 cars at 28 Fiddler's Creek Rd, Titusville. Billed as some of the most challenging hiking in Mercer, so a good friends hike; with the baby, use a carrier and take it slow. Pair with Howell Living History Farm next door or Needle Creek Farm Brewery in Pennington.","fee":"free","source_url":"https://www.fohvos.info/fohvos-hiking-trails/ted-stiles/","confidence":"High","id":"n-baldpate-mountain-summit-trail"},{"name":"Forbidden Drive, Wissahickon Valley Park","kind":"park-stroll","park":"Wissahickon Valley Park (Fairmount Park)","town":"Philadelphia (Chestnut Hill / Mt. Airy / Roxborough)","county":"Philadelphia","state":"PA","length":"5.35 mi one way, wide flat gravel","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"A wide gravel road along Wissahickon Creek at the bottom of a steep wooded gorge; 2,000 acres of forest inside the city. Philly peaks last, so this is the late season pick.","best_time":"Late Oct to early Nov (Philadelphia peaks latest); weekday mornings, over a million visitors a year","tips":"Start at Valley Green (restrooms at Valley Green Inn) and walk either way; the gravel main drive is stroller friendly, the upper trails are steep and rocky. Do not park on Livezey Lane or Kitchen's Lane. Bikes yield to walkers.","fee":"free","source_url":"https://fow.org/visit-the-park/maps/","confidence":"High","id":"n-forbidden-drive-wissahickon-valley-park","area":"NW Philly"},{"name":"D&R feeder canal: Lambertville to Stockton (Prallsville Mills)","kind":"towpath-walk","park":"Delaware and Raritan Canal State Park","town":"Lambertville / Stockton","county":"Hunterdon","state":"NJ","length":"About 4.2 mi one way, Lambertville to Prallsville Mills","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Mostly shaded crushed stone path between the canal and the river, with the PA bluffs lit up across the water. Ends at the historic Prallsville Mills in Stockton.","best_time":"Late Oct to early Nov; any time, it is shaded","tips":"Park at Mt. Hope St in Lambertville. Surface is level packed dirt or fine crushed stone, good for a jogging or all terrain stroller. Porta john at Prallsville Mills; otherwise use town. Odd Bird Brewing in Stockton makes a natural turnaround.","fee":"free","source_url":"https://www.njhiking.com/dr-canal-biking-lambertville-towards-frenchtown/","confidence":"High","id":"n-d-r-feeder-canal-lambertville-to-stockton-prallsville-mill"},{"name":"Ken Lockwood Gorge on the Columbia Trail","kind":"towpath-walk","park":"Columbia Trail (Hunterdon County Parks) through Ken Lockwood Gorge","town":"High Bridge / Califon (Lebanon Twp)","county":"Hunterdon","state":"NJ","length":"2.7 mi from High Bridge to the gorge trestle (5.4 mi round trip); 7 mi in Hunterdon","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"A converted rail line high above the South Branch of the Raritan as it rushes through a hemlock and hardwood gorge; the trestle over the gorge is the photo.","best_time":"Mid to late Oct (north Hunterdon turns a bit earlier)","tips":"Big paved lot in High Bridge off Main St with portable toilets; second trailhead near Califon station. Wide, level packed dirt and gravel, suitable for strollers. Pair with Esker Hart in High Bridge or Melick's Town Farm in Califon. Part of the gorge is a Wildlife Management Area, so expect hunters in season and consider orange.","fee":"free","source_url":"https://www.njhiking.com/columbia-trail/","confidence":"Medium","id":"n-ken-lockwood-gorge-on-the-columbia-trail"},{"name":"Point Mountain ridge loop","kind":"hike","park":"Point Mountain Nature Preserve (Hunterdon County Parks)","town":"Lebanon Twp (near Hampton)","county":"Hunterdon","state":"NJ","length":"4 mi loop along ridge, river and fields","difficulty":"hard","stroller":"no","carrier_ok":true,"why_fall":"A demanding climb to a rock outcrop with a wide view over the Musconetcong River valley, then a walk back along the river and field edges. A classic north Hunterdon foliage hike.","best_time":"Mid to late Oct","tips":"The county rates it Difficult: the climb to the Ridge Trail is demanding, and the trail steps near the Point Mountain Road parking area need care. Adults day, or carrier with experienced hikers. Carry in, carry out. Pair with a stop in Califon on the way home.","fee":"free","source_url":"https://www.co.hunterdon.nj.us/DocumentCenter/View/1239/Hiking-Trail-Reference-Guide-PDF","confidence":"High","id":"n-point-mountain-ridge-loop"},{"name":"Schofield Ford Covered Bridge and paved trails","kind":"park-stroll","park":"Tyler State Park","town":"Newtown","county":"Bucks","state":"PA","length":"Covered Bridge Trail 1.1 mi; 10.5 mi of paved multi-use trails parkwide","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Bucks County's longest covered bridge over Neshaminy Creek, ringed by farm fields and mature woods; a short steep climb leads to a hilltop view over fields and forest.","best_time":"Late Oct; any time of day","tips":"1,711 acre park close to Newtown. Buckman Trail (0.7 mi) and Quarry Trail are paved and ADA accessible; No. 1 Lane Trail is ADA for 0.8 mi. Covered Bridge Trail is gravel near the bridge and paved elsewhere. During the special regulation shotgun deer hunt the entire park closes, so check before heading out in late fall.","fee":"free","source_url":"https://www.pa.gov/agencies/dcnr/recreation/where-to-go/state-parks/find-a-park/tyler-state-park/hiking","confidence":"High","id":"n-schofield-ford-covered-bridge-and-paved-trails"},{"name":"Delaware Canal towpath: Yardley to Washington Crossing","kind":"towpath-walk","park":"Delaware Canal State Park (D&L Trail)","town":"Yardley / Washington Crossing","county":"Bucks","state":"PA","length":"4.6 mi one way","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Jackson's home stretch: the canal and river side by side under big sycamores, ending at Washington Crossing Historic Park.","best_time":"Late Oct to early Nov; weekday evenings before dark","tips":"Listed as complete, open and improved. Repairs at Lock 5 in Yardley (mile 13.3) have barriers up but the towpath stays open; do not go around them. Gravel surface works for a sturdy stroller. Shuttle with two cars or walk out and back.","fee":"free","source_url":"https://delawareandlehigh.org/map/trail-section/washington-crossing-yardley/","confidence":"High","id":"n-delaware-canal-towpath-yardley-to-washington-crossing"},{"name":"Washington Crossing Historic Park grounds","kind":"park-stroll","park":"Washington Crossing Historic Park","town":"Washington Crossing (Upper Makefield)","county":"Bucks","state":"PA","length":null,"difficulty":"easy","stroller":"partial","carrier_ok":true,"why_fall":"Open lawns, the historic village and the riverbank at the crossing site, framed by fall color on both shores.","best_time":"Late Oct; golden hour on the river","tips":"Grounds are free dawn to dusk for self guided walks; Visitor Center 10am to 5pm at 1112 River Rd. Guided tours Wed to Sun are ticketed. Easy place to let a new walker roam the lawns. Combine with the towpath or Bowman's Hill Tower in the Upper Park.","fee":"free","source_url":"https://www.washingtoncrossingpark.org/visit/","confidence":"High","id":"n-washington-crossing-historic-park-grounds"},{"name":"Mount Joy and Mount Misery trails","kind":"hike","park":"Valley Forge National Historical Park","town":"King of Prussia / Valley Forge","county":"Chester","state":"PA","length":"Mount Joy 2.5 mi of trails; Mount Misery about 4 mi of trails","difficulty":"moderate","stroller":"no","carrier_ok":true,"why_fall":"Hilly wooded trails with views over the encampment, plus the level Valley Creek Trail along the creek. History and hardwoods together.","best_time":"Late Oct; weekday mornings","tips":"No entrance fee. Unpaved dirt and gravel; Wolfinger Trail on Mount Misery is very steep. Park only in marked areas. The Valley Creek Trail is the gentlest option with a carrier.","fee":"free","source_url":"https://home.nps.gov/vafo/planyourvisit/trails.htm","confidence":"High","id":"n-mount-joy-and-mount-misery-trails"},{"name":"Lake Galena Hike and Bike Trail","kind":"park-stroll","park":"Peace Valley Park (Bucks County Parks)","town":"Doylestown (New Britain Twp)","county":"Bucks","state":"PA","length":"6.1 mi paved loop around the lake; 15+ mi of nature center trails","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Paved loop around a big lake with color on every shoreline; the park is an Important Bird Area with 297 species recorded, so fall migration is a bonus.","best_time":"Late Oct; mornings for birds","tips":"Peace Valley Nature Center is at 170 N Chapman Rd (Tue to Sat 10am to 5pm, Sun noon to 5pm) with a bird blind and loaner birding backpacks. Note: the Peace Valley Boat Rental is closed for all of 2026. The paved loop is the stroller pick; nature center trails are dirt.","fee":"free","source_url":"https://www.peacevalleynaturecenter.org/trail-map","confidence":"High","id":"n-lake-galena-hike-and-bike-trail"},{"name":"Ringing Rocks and High Falls","kind":"hike","park":"Ringing Rocks Park (Bucks County Parks)","town":"Upper Black Eddy (Bridgeton Twp)","county":"Bucks","state":"PA","length":"Short walk to the boulder field; 128 acre park","difficulty":"easy","stroller":"no","carrier_ok":true,"why_fall":"A boulder field of rocks that ring when struck, in the woods off River Road, with High Falls nearby. Leaves on the rocks and a walk through the woods; fun for any age.","best_time":"Late Oct; dry days (rocks are slick when wet)","tips":"Open dawn to dusk, Ringing Rocks Rd. Bring a hammer. Boulder hopping is not for a carrier wearer, so hang at the edge with the baby. Combine with Trauger's Farm Market in Kintnersville or the River Road drive.","fee":"free","source_url":"https://www.buckscounty.gov/facilities/facility/details/Ringing-Rocks-Park-5","confidence":"High","id":"n-ringing-rocks-and-high-falls"},{"name":"Nockamixon State Park paved bike trail","kind":"park-stroll","park":"Nockamixon State Park","town":"Quakertown","county":"Bucks","state":"PA","length":"2.0 mi paved, out and back; plus 4 to 5 mi easy shoreline loops","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"DCNR's pick for early season color in southeast PA; red maples and birch along a 1,450 acre lake. The paved trail runs from the marina views to a waterfall and old mill pond.","best_time":"Mid to late Oct (colors arrive here first in Bucks)","tips":"DCNR says the paved trail is ideal for strollers, bikes and walkers; modern restrooms and water at the trailhead. Elephant Trail (4.6 mi) and Church Trail (5.1 mi) are easy shoreline loops. Commercial boat rentals are summer only.","fee":"free","source_url":"https://www.pa.gov/agencies/dcnr/recreation/where-to-go/state-parks/find-a-park/nockamixon-state-park/biking","confidence":"High","id":"n-nockamixon-state-park-paved-bike-trail"},{"name":"Mount Tammany (Red Dot and Blue Blaze loop)","kind":"hike","park":"Delaware Water Gap National Recreation Area / Worthington State Forest","town":"Delaware Water Gap (Dunnfield Creek trailhead)","county":"Other NJ","state":"NJ","length":"3 mi loop; Red Dot climbs 1,201 ft in 1.2 mi","difficulty":"hard","stroller":"no","carrier_ok":false,"why_fall":"The classic Water Gap view straight down on the river cutting through Kittatinny Ridge. Peaks earlier than home, around Oct 17 to 20.","best_time":"Mid Oct; arrive at dawn, the lot fills fast","tips":"Worth the drive from Yardley. Go up Red Dot and down the Blue Blaze, which most find easier. Steep, rocky and stair stepped; adults only, not a carrier hike. Restroom at the Dunnfield Creek trailhead.","fee":"unknown","source_url":"https://www.nps.gov/dewa/planyourvisit/red-dot-trail.htm","confidence":"High","id":"n-mount-tammany-red-dot-and-blue-blaze-loop"},{"name":"Hawk Mountain Sanctuary lookouts","kind":"viewpoint","park":"Hawk Mountain Sanctuary","town":"Kempton","county":"Other","state":"PA","length":"South Lookout via the accessible Silhouette Trail; North Lookout is a longer, rocky climb","difficulty":"moderate","stroller":"partial","carrier_ok":true,"why_fall":"Raptor migration on the Appalachian flyway; October has the greatest hawk diversity, and the ridge colors peak in late October.","best_time":"Mid to late Oct for hawk diversity plus color","tips":"Worth the drive from Yardley. Trail fee; the Discover Lehigh Valley listing shows adults $9, seniors $7, kids $5. Visitor center 8am to 5pm Sept to Nov; trails dawn to dusk. The South Lookout trail is ADA rated but steep to push, so carrier is easier. 1700 Hawk Mountain Rd.","fee":"trail fee (adults about $9 per listing)","source_url":"https://www.discoverlehighvalley.com/directory/hawk-mountain-sanctuary/","confidence":"Medium","id":"n-hawk-mountain-sanctuary-lookouts"},{"name":"Bowman's Hill Wildflower Preserve","kind":"nature-preserve","park":"Bowman's Hill Wildflower Preserve","town":"New Hope (Solebury)","county":"Bucks","state":"PA","length":"2.5 mi of trails on about 100 acres","difficulty":"easy","stroller":"partial","carrier_ok":true,"why_fall":"Native plant preserve along Pidcock Creek with forest, meadows and ponds; fall asters, goldenrod and native trees at their best, right below Bowman's Tower.","best_time":"Mid to late Oct; open Wed to Mon 9am to 5pm (closed Tuesdays)","tips":"Adults $12, seniors $9, kids 5 to 17 $6, under 5 free; combo ticket with Bowman's Hill Tower. Access cart tours by reservation. Native plant nursery open into mid November. 1635 River Rd.","fee":"$12 adults; under 5 free","source_url":"https://bhwp.org/visit/","confidence":"High","id":"n-bowman-s-hill-wildflower-preserve"},{"name":"Washington Crossing State Park trails and Nature Center","kind":"hike","park":"Washington Crossing State Park","town":"Titusville (Hopewell Twp)","county":"Mercer","state":"NJ","length":"14 trails; Blue Dot 2.7 mi, Continental Lane 1.4 mi, D&R Canal Trail 1.1 mi","difficulty":"easy","stroller":"partial","carrier_ok":true,"why_fall":"Mostly flat to gently rolling hardwood forest and meadow along Steele Run, with a scenic overlook and the canal. The NJ side of the crossing.","best_time":"Late Oct","tips":"Nature Center (609 737 0609) and a bird blind; Visitor Center Museum (609 737 0623). Continental Lane runs from the park office to the Johnson Ferry House and overlook on natural surface. The D&R Canal Trail section is cinder and crushed stone, the best stroller choice.","fee":"unknown","source_url":"https://dep.nj.gov/wp-content/uploads/parksandforests/Washington-Crossing.pdf","confidence":"High","id":"n-washington-crossing-state-park-trails-and-nature-center"},{"name":"Musconetcong Gorge Preserve","kind":"hike","park":"Musconetcong Gorge Preserve (Hunterdon County Parks)","town":"Hunterdon County (northwest)","county":"Hunterdon","state":"NJ","length":"6+ mi of trails; Ridge Trail sits 700+ ft above the Railroad Trail","difficulty":"hard","stroller":"no","carrier_ok":true,"why_fall":"Switchbacks down into and out of a steep wooded gorge on the Musconetcong; big elevation and big color for north Hunterdon.","best_time":"Mid to late Oct","tips":"County rates it Difficult either way on the switchback trail. The Railroad Trail at the bottom is flatter. Carry in, carry out. Adults day; pair with Phillips Farms or Descendants Brewing in Milford.","fee":"free","source_url":"https://www.co.hunterdon.nj.us/DocumentCenter/View/1239/Hiking-Trail-Reference-Guide-PDF","confidence":"High","id":"n-musconetcong-gorge-preserve"},{"name":"Round Valley Recreation Area","kind":"hike","park":"Round Valley Recreation Area","town":"Lebanon","county":"Hunterdon","state":"NJ","length":"Pine Tree and Hike and Bike loops about 1 mi each; Little Round Top climb 200 ft; Cushetunk Trail 7.6 mi one way","difficulty":"moderate","stroller":"partial","carrier_ok":true,"why_fall":"A 2,350 acre, 180 foot deep reservoir ringed by Cushetunk Mountain; Little Round Top gives a reservoir view east and Jugtown Mountain west.","best_time":"Mid to late Oct","tips":"All trails start from the South Lot (1220 Stanton-Lebanon Rd). Pine Tree and Hike and Bike loops are rated ideal for young children. Cushetunk is rugged, rocky and steep with no outlet, an adults out and back. Seasonal deer hunting in designated areas.","fee":"unknown","source_url":"https://dep.nj.gov/wp-content/uploads/parksandforests/roundvalley-area.pdf","confidence":"High","id":"n-round-valley-recreation-area"},{"name":"Sourland Mountain Preserve Ridge Trail","kind":"hike","park":"Sourland Mountain Preserve (Somerset County Park Commission)","town":"Hillsborough","county":"Other NJ","state":"NJ","length":"Ridge Trail 5 mi; Maple Flats 1.4 mi; Pond View 1 mi","difficulty":"hard","stroller":"no","carrier_ok":true,"why_fall":"Boulder fields and 39 wooden walkways through a big unbroken forest on the Sourland ridge; Devil's Half Acre boulders are nearby.","best_time":"Late Oct","tips":"Somerset County, just past Hopewell. Lot for 30+ cars off East Mountain Rd with a portable restroom and map kiosk. Maple Flats is the easier carrier option; the Ridge Trail is demanding. Dogs on leash.","fee":"free","source_url":"https://njtrails.org/trail/sourland-mountain-preserve-somerset/","confidence":"Medium","id":"n-sourland-mountain-preserve-ridge-trail"},{"name":"NJ Route 29 and Federal Twist Road scenic drive","kind":"scenic-drive","park":"Delaware River corridor and Hunterdon back roads","town":"Lambertville to Frenchtown","county":"Hunterdon","state":"NJ","length":null,"difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Route 29 hugs the river and the D&R feeder canal; Federal Twist Road climbs from the river near Bull's Island into farm country.","best_time":"Late Oct; weekend mornings","tips":"Suggested route: coffee in Lambertville, Goat Hill Overlook, north on 29 to Prallsville Mills and Odd Bird Brewing in Stockton, Bull's Island for the footbridge, up Federal Twist Rd to Federal Twist Vineyard, back to 29 for Frenchtown (Wild Fern Brewing), then cross to PA and return on River Road. Six bridges link the NJ and PA towpaths for loop walks along the way.","fee":"free","source_url":"https://dep.nj.gov/wp-content/uploads/parksandforests/DR-canal_web.pdf","confidence":"Medium","id":"n-nj-route-29-and-federal-twist-road-scenic-drive"},{"name":"Bucks County covered bridges drive","kind":"scenic-drive","park":"Bucks County Covered Bridge Driving Tour","town":"Tinicum, Plumstead, New Hope and Newtown","county":"Bucks","state":"PA","length":"12 bridges countywide; a short version hits the Tinicum cluster","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Twelve surviving covered bridges, most on creeks in wooded hollows; the Tinicum cluster (Frankenfield, Erwinna, Uhlerstown) sits right off River Road.","best_time":"Late Oct","tips":"Construction note: drivers currently cannot drive through the Frankenfield or Uhlerstown bridges. Van Sant (1875) is near New Hope; Schofield Ford at Tyler is walk in only. Short loop: River Road north to Erwinna, the Tinicum bridges, then Trauger's Farm Market. Long loop adds Loux and Cabin Run in Plumstead.","fee":"free","source_u y","stroller":"yes","carrier_ok":true,"why_fall":"Paved path through woods and fields along Ridley Creek in a 2,606 acre park; a Delco classic for fall color.","best_time":"Late Oct to early Nov","tips":"400 Gradyville Rd. Mansion Gardens Trail is a 1 mi paved loop. Yellow, White and Blue trails (3.7 to 4.3 mi) are the hiking options. Colonial Pennsylvania Farmstead is open weekends through November. Tyler Arboretum is adjacent.","fee":"free","source_url":"https://www.pa.gov/agencies/dcnr/recreation/where-to-go/state-parks/find-a-park/ridley-creek-state-park/hiking","confidence":"High","id":"n-ridley-creek-state-park-sycamore-mills-road-trail"},{"name":"Joseph Plumb Martin Trail inner loop","kind":"park-stroll","park":"Valley Forge National Historical Park","town":"King of Prussia","county":"Montgomery","state":"PA","length":"5 mi paved inner loop (8.7 mi total)","difficulty":"moderate","stroller":"yes","carrier_ok":true,"why_fall":"Paved loop past the Grand Parade, huts and monuments with open meadow views to wooded Mount Joy.","best_time":"Late Oct; morning, there is little shade","tips":"Paved but hilly, so a jogging stroller helps. No entrance fee. Connects to the Schuylkill River Trail.","fee":"free","source_url":"https://home.nps.gov/vafo/planyourvisit/trails.htm","confidence":"High","id":"n-joseph-plumb-martin-trail-inner-loop"},{"name":"Teetertown Preserve","kind":"hike","park":"Teetertown Preserve (Hunterdon County Parks)","town":"Lebanon Twp","county":"Hunterdon","state":"NJ","length":null,"difficulty":"moderate","stroller":"no","carrier_ok":true,"why_fall":"A wooded ravine with rocks and a stream plus field trails in the Mountain Farm Section; quiet north Hunterdon color.","best_time":"Mid to late Oct","tips":"County rates it moderate; the Ravine Section is more challenging because of slope and rocks, the Mountain Farm Section circles fields. Carrier only. Carry in, carry out.","fee":"free","source_url":"https://www.co.hunterdon.nj.us/DocumentCenter/View/ nd compacted ground; parks office is here at 1020 Route 31. Trail maps and brochures available on site.","fee":"free","source_url":"https://www.co.hunterdon.nj.us/DocumentCenter/View/1239/Hiking-Trail-Reference-Guide-PDF","confidence":"Medium","id":"n-hunterdon-county-arboretum"},{"name":"Wescott Preserve on the Lockatong","kind":"nature-preserve","park":"Wescott Preserve (Hunterdon County Parks)","town":"Hunterdon County","county":"Hunterdon","state":"NJ","length":"1 mi loop","difficulty":"easy","stroller":"no","carrier_ok":true,"why_fall":"A short loop sloping down to Lockatong Creek in the heart of Hunterdon farm country; easy to fold into the Federal Twist drive.","best_time":"Late Oct","tips":"Mix of compacted ground and sod with a small climb back to the parking area. Carrier recommended.","fee":"free","source_url":"https://www.co.hunterdon.nj.us/DocumentCenter/View/1239/Hiking-Trail-Reference-Guide-PDF","confidence":"Medium","id":"n-wescott-preserve-on-the-lockatong"},{"name":"Bike the D&R feeder canal: Lambertville to Frenchtown","kind":"bike","park":"Delaware and Raritan Canal State Park","town":"Lambertville to Frenchtown","county":"Hunterdon","state":"NJ","length":"21.8 mi round trip from Lambertville","difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"Flat, shaded rail trail beside the canal and river with color the whole way; Stockton, Bull's Island and Frenchtown as stops.","best_time":"Late Oct; weekday or early weekend","tips":"Rentals: Pure Energy Cycling at the Riverwalk in Lambertville (adult bikes $18 per hour or $60 per day, e-bikes from $25 per hour; reserve 24 hrs ahead; closed Sundays; no child seats or trailers). Packed dirt and fine crushed stone suits hybrids. Bring your own bike trailer for the baby.","fee":"free","source_url":"https://pureenergycycling.com/bike-rentals/","confidence":"High","id":"n-bike-the-d-r-feeder-canal-lambertville-to-frenchtown"},{"name":"Paddle the D&R feeder canal from Bull's Island","kind":"paddle","park":"Delaware and Raritan Canal State Park","town":"Stockton (Bull's Island)","county":"Hunterdon","state":"NJ","length":null,"difficulty":"easy","stroller":"no","carrier_ok":false,"why_fall":"Flat canal water under a full canopy of color; the calmest way to be on the water in late fall.","best_time":"Mid to late Oct on a warm, still day","tips":"Bring your own boat: commercial rentals are done for the year (Bucks County River Country is closed until 2027 and the Peace Valley rental is closed for 2026). The river launch permit is only required Memorial Day to Labor Day; paddlers must portage the concrete locks. Cold water, so PFDs on and this is an adults outing.","fee":"free","source_url":"https://dep.nj.gov/wp-content/uploads/parksandforests/DR-canal_web.pdf","confidence":"Medium","id":"n-paddle-the-d-r-feeder-canal-from-bull-s-island"},{"name":"Mill Grove trails and paved Audubon Loop","kind":"park-stroll","park":"John James Audubon Center at Mill Grove","town":"Audubon","county":"Montgomery","state":"PA","length":null,"difficulty":"easy","stroller":"partial","carrier_ok":true,"why_fall":"Wooded bird sanctuary trails above the Perkiomen Creek around Audubon's 1762 home; prime fall migration birding.","best_time":"Sunday mornings (free museum 10am to noon); mid to late Oct","tips":"Grounds open sunrise to sunset; paved Audubon Loop is the stroller and dog option. Nature play area for little kids. Connects by trail to Lower Perkiomen Valley Park.","fee":"free grounds; museum $7","source_url":"https://www.audubon.org/john-james/visit","confidence":"Medium","id":"n-mill-grove-trails-and-paved-audubon-loop"},{"name":"Lower Perkiomen Valley Park and Perkiomen Trail trailhead","kind":"park-stroll","park":"Lower Perkiomen Valley Park","town":"Oaks","county":"Montgomery","state":"PA","length":null,"difficulty":"easy","stroller":"yes","carrier_ok":true,"why_fall":"107 acres along the Perkiomen Creek where the Perkiomen and Schuylkill River trails meet; easy creekside function pass(x) {

  if (!passActs(x)) return false;
  if (S.regions.size && !S.regions.has(x.county) && !(x.area && S.regions.has(x.area))) return false;
  if (S.cat && x.category !== S.cat) return false;
  if (S.fam && !x.family_friendly) return false;
  if (S.free && !isFree(x.tickets || x.fee)) return false;
  if (S.kids && !x.little_kids) return false;
  if (S.conf && String(x.date_confidence || "").startsWith("likely")) return false;
  if (!S.low && x.confidence === "Low") return false;
  if (S.q) {
    const hay = [x.name, x.venue, x.town, x.county, x.description, x.what, x.notes, CATS[x.category]].join(" ").toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function mapUrl(...parts) {
  const q = parts.filter(Boolean).join(", ");
  return q ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q) : null;
}
function calUrl(e) {
  const sd = e.start_date.replace(/-/g, ""), ed = addDays(e.end_date && e.end_date > e.start_date ? e.end_date : e.start_date, 1).replace(/-/g, "");
  const details = [e.time ? "Time: " + e.time : "", e.tickets && e.tickets !== "unknown" ? "Tickets: " + e.tickets : "", e.description || "", e.source_url || ""].filter(Boolean).join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(e.name) + "&dates=" + sd + "/" + ed +
    "&location=" + encodeURIComponent([e.venue, e.town, e.state].filter(Boolean).join(", ")) + "&details=" + encodeURIComponent(details);
}
function starBtn(id, name) {
  const on = S.stars.has(id);
  return `<button class="star" data-star="${esc(id)}" aria-pressed="${on}" aria-label="${on ? "Remove from" : "Add to"} shortlist: ${esc(name)}">${on ? "★" : "☆"}</button>`;
}

function evCard(e, ws, isPick) {
  const sd = d(e.start_date), ed = e.end_date ? d(e.end_date) : null;
  let when = ed && iso(ed) !== iso(sd) ? range(sd, ed) : `${DOW[sd.getDay()].slice(0, 3)}, ${short(sd)}`;
  if (ws && sd < ws) when = "Continuing, " + when;
  const loc = [e.venue, e.town].filter(Boolean).join(", ");
  const likely = String(e.date_confidence || "").startsWith("likely");
  const url = safeUrl(e.source_url);
  return `<article class="ev"><div class="main">
    <h4>${isPick ? '<span class="pk" title="Top pick">★</span>' : ""}${esc(e.name)}</h4>
    <div class="meta">${esc(when)}${e.time ? " · " + esc(e.time) : ""} · ${esc(loc)} · <span class="co">${esc(REG_LABEL[e.county] || e.county)}</span></div>
    <p class="desc">${esc(e.description)}</p>
    ${(e.acts || []).length ? `<div class="foot"><span class="acttags">${e.acts.map(a => esc(ACT_LABEL[a])).join(" · ")}</span></div>` : ""}
    <div class="foot"><span class="tag">${esc(CATS[e.category] || e.category || "")}</span>
      ${e.tickets && e.tickets !== "unknown" ? `<span>${esc(e.tickets)}</span>` : ""}
      ${e.little_kids ? `<span class="kidtag">Little kids${e.ages ? ", ages " + esc(e.ages) : ""}${e.registration && e.registration !== "unknown" ? ", " + esc(e.registration === "required" ? "register ahead" : e.registration) : ""}</span>` : (e.family_friendly ? "<span>Good for kids</span>" : "")}
      ${likely ? '<span class="likely">2026 date not yet posted, check first</span>' : ""}
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Source</a>` : ""}
      ${mapUrl(e.venue, e.town, e.state) ? `<a class="act" href="${esc(mapUrl(e.venue, e.town, e.state))}" target="_blank" rel="noopener">Directions</a>` : ""}
      <a class="act" href="${esc(calUrl(e))}" target="_blank" rel="noopener">Add to calendar</a></div>
  </div>${starBtn(e.id, e.name)}</article>`;
}

function spotCard(s) {
  const url = safeUrl(s.source_url);
  return `<article class="ev"><div class="main">
    <h4>${esc(s.name)}</h4>
    <div class="meta">${esc(s.town || "")} · <span class="co">${esc(REG_LABEL[s.county] || s.county)}</span>${s.season_dates ? " · " + esc(s.season_dates) : ""}</div>
    <p class="desc">${esc(s.what)}</p>
    ${(s.acts || []).length ? `<div class="foot"><span class="acttags">${s.acts.map(a => esc(ACT_LABEL[a])).join(" · ")}</span></div>` : ""}
    <div class="foot"><span class="tag">${esc(CATS[s.category] || "")}</span>
      ${s.hours ? `<span>Hours: ${esc(s.hours)}</span>` : ""}
      ${s.tickets && s.tickets !== "unknown" ? `<span>${esc(s.tickets)}</span>` : ""}
      ${s.little_kids ? `<span class="kidtag">Little kids${s.ages ? ", ages " + esc(s.ages) : ""}</span>` : (s.family_friendly ? "<span>Good for kids</span>" : "")}
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Source</a>` : ""}
      ${mapUrl(s.name, s.town, s.state) ? `<a class="act" href="${esc(mapUrl(s.name, s.town, s.state))}" target="_blank" rel="noopener">Directions</a>` : ""}</div>
    ${s.notes ? `<div class="foot"><span>${esc(s.notes)}</span></div>` : ""}
  </div>${starBtn(s.id, s.name)}</article>`;
}

function weekEvents(ws, we) {
  return DATA.events.filter(e => { const sd = d(e.start_date), ed = e.end_date ? d(e.end_date) : sd; return sd <= we && ed >= ws && iso(ed) >= NOW });
}

function renderWeeks() {
  let html = "", any = false;
  if (S.acts.size) {
    const sp = DATA.spots.filter(pass);
    if (sp.length) {
      const what = [...S.acts].map(a => ACT_LABEL[a].toLowerCase()).join(" + ");
      html += `<section class="alsoseason"><h2>Also open all season (${sp.length})</h2><p>Farms and places with ${esc(what)} that are open many days, not just one date. Check hours before you go.</p>${sp.sort((a, b) => a.name.localeCompare(b.name)).map(spotCard).join("")}</section>`;
    }
  }
  for (const [a, b] of DATA.weeks) {
    if (b < NOW) continue;
    if ((S.from && b < S.from) || (S.to && a > S.to)) continue;
    const ws = d(a), we = d(b), all = weekEvents(ws, we), evs = all.filter(pass);
    if (!evs.length && S.acts.size) continue;
    const tg = THANKS >= a && THANKS <= b;
    const sat = new Date(ws); sat.setDate(ws.getDate() + 5);
    const pickList = DATA.picks[a] || [], pickIds = pickList.map(p => p.id);
    const picks = pickList.map(p => { const e = DATA.events.find(x => x.id === p.id); return e && {...e, why: p.why} }).filter(e => e && pass(e) && (e.end_date || e.start_date) >= NOW);
    html += `<section class="week" id="w-${a}"><h2>${tg ? "Thanksgiving week" : "Weekend of " + range(sat, we)}</h2>
      <div class="sub">${range(ws, we)} · ${evs.length} of ${all.length} events shown</div>`;
    if (picks.length && !S.cat && !S.q) {
      html += `<div class="picks"><h3>★ Top picks this weekend</h3><ol>${picks.map(p => `<li><b>${esc(p.name)}</b> <span>${esc(DOW[d(p.start_date).getDay()])}, ${esc(p.town || "")}. ${esc(p.why || "")}</span></li>`).join("")}</ol></div>`;
    }
    if (!S.kids) {
      const kev = all.filter(e => e.little_kids && pass(e)).sort((p, q) => p.start_date.localeCompare(q.start_date));
      const wkly = DATA.spots.filter(sp => sp.little_kids && pass(sp));
      if (kev.length || wkly.length) {
        html += `<div class="kids"><h3>For the little one this week</h3>`;
        if (kev.length) html += `<ul>${kev.map(k => { const x = d(k.start_date); return `<li><b>${esc(k.name)}</b> <span>${DOW[x.getDay()].slice(0, 3)} ${short(x)}${k.time ? ", " + esc(k.time) : ""} · ${esc(k.town || "")}</span></li>` }).join("")}</ul>`;
        if (wkly.length) html += `<div class="weekly">Plus ${wkly.length} repeating programs (toddler walks, farm story times). <a data-goto="kids">See them under Open all season</a>.</div>`;
        html += `</div>`;
      }
    }
    if (!evs.length) { html += `<p class="empty">Nothing matches your filters this week.</p></section>`; continue }
    any = true;
    const days = {};
    const floor = d([a, NOW, S.from || a].sort().pop());
    for (const e of evs) {
      let k = iso(d(e.start_date) < floor ? floor : d(e.start_date));
      if (S.dow) {
        const last = e.end_date && e.end_date > k ? e.end_date : k;
        for (let i = 0; i < 70 && k <= last; i++) {
          const wd = d(k).getDay(), weekend = wd === 0 || wd === 6;
          if (S.dow === "we" ? weekend : !weekend) break;
          k = addDays(k, 1);
        }
        if (k > last) continue;
      }
      if (k > b) continue;
      (days[k] = days[k] || []).push(e);
    }
    const rk = c => ({High: 3, Medium: 2, Low: 1}[c] || 0);
    for (const k of Object.keys(days).sort()) {
      const x = d(k), wkd = x.getDay() === 0 || x.getDay() === 6;
      const tag = k === THANKS ? "Thanksgiving" : (x.getDay() === 1 && k === "2026-10-12" ? "Columbus Day" : (k === "2026-11-11" ? "Veterans Day" : ""));
      html += `<div class="day"><h3 class="${wkd ? "weekend" : ""}">${DOW[x.getDay()]}, ${short(x)}${tag ? ` <span class="wk">${tag}</span>` : ""}</h3>`;
      html += days[k].sort((p, q) => (pickIds.includes(q.id) - pickIds.includes(p.id)) || rk(q.confidence) - rk(p.confidence) || p.name.localeCompare(q.name))
        .map(e => evCard(e, ws, pickIds.includes(e.id))).join("") + `</div>`;
    }
    html += `</section>`;
  }
  if (S.acts.size && !html) html = `<p class="empty">Nothing matches that combination. Try removing one of the activity chips.</p>`;
  return html;
}

function renderSeason() {
  const sp = DATA.spots.filter(pass);
  if (!sp.length) return `<p class="empty">No season-long spots match your filters.</p>`;
  let html = `<p class="note">Farms, patches, orchards and mazes that are open across many weekends. Hours and pick conditions change fast in October, so check the source page or call before you drive out.</p><p class="note"><b>Apples are short this year.</b> A late April freeze hit the crop hard. Terhune's apple picking is very limited and needs a ticket, Bonacorsi has none this year, and Solebury and Manoff are limited (Solebury is mostly selling pre-picked). For real apple picking, Phillips Farms and Melick's in Hunterdon are the safer bets; call ahead. Pumpkins are fine.</p>`;
  for (const r of REG_ORDER) {
    const rs = sp.filter(s => s.county === r).sort((a, b) => a.name.localeCompare(b.name));
    if (!rs.length) continue;
    html += `<section class="region"><h2>${esc(REG_LABEL[r])}</h2>${rs.map(spotCard).join("")}</section>`;
  }
  return html;
}

const KINDS = [["hike","Hikes"],["viewpoint","Viewpoints"],["nature-preserve","Nature preserves"],["towpath-walk","Towpaths and easy strolls"],["park-stroll","Towpaths and easy strolls"],["scenic-drive","Scenic drives"],["bike","Biking and paddling"],["paddle","Biking and paddling"]];
const STROLLER = {yes: "Stroller friendly", partial: "Stroller in parts", no: "No stroller"};
function passN(p) {
  if (S.regions.size && !S.regions.has(p.county) && !(p.area && S.regions.has(p.area))) return false;
  if (!S.low && p.confidence === "Low") return false;
  if (S.free && !isFree(p.fee)) return false;
  if (S.kids && !(p.stroller === "yes" || p.stroller === "partial" || p.carrier_ok)) return false;
  if (S.q) {
    const hay = [p.name, p.park, p.town, p.county, p.why_fall, p.tips, p.kind].join(" ").toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}
function natCard(p) {
  const url = safeUrl(p.source_url);
  const bits = [p.length, p.difficulty && p.difficulty[0].toUpperCase() + p.difficulty.slice(1), STROLLER[p.stroller], p.carrier_ok && p.stroller !== "yes" ? "Carrier OK" : "", p.fee && p.fee !== "unknown" ? p.fee : ""].filter(Boolean);
  return `<article class="ev"><div class="main">
    <h4>${esc(p.name)}</h4>
    <div class="meta">${esc([p.park, p.town].filter(Boolean).join(", "))} · <span class="co">${esc(REG_LABEL[p.county] || p.county)}</span>${p.best_time ? " · Best: " + esc(p.best_time) : ""}</div>
    <p class="desc">${esc(p.why_fall)}</p>
    <div class="foot">${bits.map(b => `<span class="tag">${esc(b)}</span>`).join("")}${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Source</a>` : ""}${mapUrl(p.park || p.name, p.town, p.state) ? `<a class="act" href="${esc(mapUrl(p.park || p.name, p.town, p.state))}" target="_blank" rel="noopener">Directions</a>` : ""}</div>
    ${p.tips ? `<div class="foot"><span>${esc(p.tips)}</span></div>` : ""}
  </div>${starBtn(p.id, p.name)}</article>`;
}
function renderOut() {
  const N = DATA.nature || {places: []}, o = N.outlook;
  let html = "";
  if (o) html += `<div class="outlook"><h3>Fall color outlook</h3>${o.peak_window ? `<p>Expected peak: <span class="pw">${esc(o.peak_window)}</span></p>` : ""}<p>${esc(o.summary)}</p>${(o.sources || []).length ? `<p class="src">Sources: ${o.sources.map((u, i) => safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${i + 1}</a>` : "").join(", ")}</p>` : ""}</div>`;
  const ps = N.places.filter(passN);
  if (!ps.length) return html + `<p class="empty">No outdoor spots match your filters.</p>`;
  const rk = c => ({High: 3, Medium: 2, Low: 1}[c] || 0);
  const done = new Set();
  for (const [, label] of KINDS) {
    if (done.has(label)) continue; done.add(label);
    const kinds = KINDS.filter(k => k[1] === label).map(k => k[0]);
    const rs = ps.filter(p => kinds.includes(p.kind));
    if (rs.length) html += `<section class="region"><h2>${esc(label)}</h2>${rs.map(natCard).join("")}</section>`;
  }
  return html;
}

function renderShort() {
  const evs = DATA.events.filter(e => S.stars.has(e.id)).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const sp = DATA.spots.filter(s => S.stars.has(s.id));
  const np = ((DATA.nature || {}).places || []).filter(p => S.stars.has(p.id));
  if (!evs.length && !sp.length && !np.length) return `<p class="empty">Tap ☆ on any event or farm to save it here. Your shortlist stays in this browser.</p>`;
  let html = "";
  if (evs.length) html += `<section class="region"><h2>Dated events</h2>${evs.map(e => evCard(e, null, false)).join("")}</section>`;
  if (sp.length) html += `<section class="region"><h2>Open all season</h2>${sp.map(spotCard).join("")}</section>`;
  if (np.length) html += `<section class="region"><h2>Outdoors</h2>${np.map(natCard).join("")}</section>`;
  return html;
}

function render() {
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.view === S.view);
  document.getElementById("shortN").textContent = S.stars.size ? `(${S.stars.size})` : "";
  document.getElementById("weeknav").hidden = S.view !== "weeks";
  const dated = S.view === "weeks" || S.view === "short";
  document.getElementById("dates").hidden = !dated;
  document.getElementById("quick").hidden = !dated;
  document.getElementById("dfrom").value = S.from; document.getElementById("dto").value = S.to;
  document.getElementById("dow").value = S.dow;
  document.getElementById("qclear").hidden = !(S.from || S.to || S.dow);
  const nAct = S.regions.size + S.acts.size + [S.cat, S.fam, S.kids, S.free, S.conf, S.low, S.q, S.from || S.to, S.dow].filter(Boolean).length;
  document.getElementById("factive").textContent = nAct ? `(${nAct} on)` : "";
  document.getElementById("clearall").hidden = !nAct;
  const src = S.view === "season" ? DATA.spots : S.view === "out" ? ((DATA.nature || {}).places || []) : DATA.events;
  const counts = {}; for (const x of src) { counts[x.county] = (counts[x.county] || 0) + 1; if (x.area) counts[x.area] = (counts[x.area] || 0) + 1 }
  const actsEl = document.getElementById("acts");
  document.getElementById("actrow").hidden = S.view === "out";
  if (S.view !== "out") {
    const base = (S.view === "season" ? DATA.spots : S.view === "short" ? [...DATA.events, ...DATA.spots].filter(x => S.stars.has(x.id)) : [...DATA.events.filter(e => (e.end_date || e.start_date) >= NOW), ...DATA.spots]);
    const keep = S.acts; S.acts = new Set();
    const pool = base.filter(pass); S.acts = keep;
    const withSel = pool.filter(passActs);
    actsEl.innerHTML = ACT_ORDER.map(a => {
      const on = S.acts.has(a);
      const n = on ? withSel.length : withSel.filter(x => (x.acts || []).includes(a)).length;
      return `<button class="chip" data-act="${a}" aria-pressed="${on}">${ACT_LABEL[a]}<span class="n">${n}</span></button>`;
    }).join("");
  }
  document.getElementById("regions").innerHTML = REG_ORDER.filter(r => counts[r]).map(r =>
    `<button class="chip" data-reg="${r}" aria-pressed="${S.regions.has(r)}">${REG_LABEL[r]}<span class="n">${counts[r]}</span></button>`).join("") +
    (S.regions.size ? `<button class="chip" data-reg="" aria-pressed="false">Clear</button>` : "");
  document.getElementById("cat").hidden = S.view === "out";
  document.getElementById("out").innerHTML = S.view === "weeks" ? renderWeeks() : S.view === "season" ? renderSeason() : S.view === "out" ? renderOut() : renderShort();
}

function init() {
  const nE = DATA.events.length, nS = DATA.spots.length;
  document.getElementById("lede").textContent = `${nE} dated events and ${nS} farms, orchards and patches open all season, from Oct 5 through Thanksgiving weekend. Deepest on Bucks, Mercer and Hunterdon, with the best of Montco, Chester, Delaware County and Philly. Every item links to the page where it was confirmed.`;
  const b = d(DATA.built);
  document.getElementById("built").textContent = `Researched ${MON[b.getMonth()]} ${b.getDate()}, ${b.getFullYear()}. Dates and hours change, so check the source before you go.`;
  const cat = document.getElementById("cat");
  const used = new Set([...DATA.events, ...DATA.spots].map(x => x.category));
  cat.innerHTML = `<option value="">All categories</option>` + Object.entries(CATS).filter(([k]) => used.has(k)).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  cat.value = S.cat;
  document.getElementById("fam").checked = S.fam;
  document.getElementById("conf").checked = S.conf;
  document.getElementById("kidsf").checked = S.kids;
  document.getElementById("kidsN").textContent = `(${[...DATA.events, ...DATA.spots].filter(x => x.little_kids).length})`;
  document.getElementById("low").checked = S.low;
  document.getElementById("lowN").textContent = `(${[...DATA.events, ...DATA.spots].filter(x => x.confidence === "Low").length})`;
  document.getElementById("weeknav").innerHTML = DATA.weeks.filter(([a, b]) => b >= NOW).map(([a, b]) => {
    const tg = THANKS >= a && THANKS <= b;
    return `<a href="#w-${a}" class="${tg ? "tg" : ""}">${tg ? "Thanksgiving" : short(d(a))}</a>`;
  }).join("");

  document.querySelector(".tabs").addEventListener("click", ev => {
    const t = ev.target.closest(".tab"); if (!t) return;
    S.view = t.dataset.view; store.set("view", S.view); render();
  });
  document.getElementById("acts").addEventListener("click", ev => {
    const c = ev.target.closest(".chip"); if (!c) return;
    const a = c.dataset.act; S.acts.has(a) ? S.acts.delete(a) : S.acts.add(a);

  });
  document.getElementById("regions").addEventListener("click", ev => {
    const c = ev.target.closest(".chip"); if (!c) return;
    const r = c.dataset.reg;
    if (!r) S.regions.clear(); else S.regions.has(r) ? S.regions.delete(r) : S.regions.add(r);
    store.set("regions", [...S.regions]); render();
  });
  cat.addEventListener("change", () => { S.cat = cat.value; store.set("cat", S.cat); render() });
  document.getElementById("fam").addEventListener("change", e => { S.fam = e.target.checked; store.set("fam", S.fam); render() });
  document.getElementById("conf").addEventListener("change", e => { S.conf = e.target.checked; store.set("conf", S.conf); render() });
  const setDates = (f, t2) => { S.from = f; S.to = t2; if (S.view !== "short") S.view = "weeks"; render(); jumpTo(document.querySelector(".bar").offsetTop) };
  document.getElementById("dfrom").addEventListener("change", e => { S.from = e.target.value; if (S.to && S.to < S.from) S.to = S.from; render() });
  document.getElementById("dto").addEventListener("change", e => { S.to = e.target.value; if (S.from && S.from > S.to) S.from = S.to; render() });
  document.getElementById("dow").addEventListener("change", e => { S.dow = e.target.value; store.set("dow", S.dow); render() });
  document.getElementById("quick").addEventListener("click", ev => {
    const c = ev.target.closest("[data-q]"); if (!c) return;
    const q = c.dataset.q, wd = d(NOW).getDay();
    const sat = wd === 0 ? addDays(NOW, -1) : addDays(NOW, (6 - wd + 7) % 7);
    if (q === "this") setDates(NOW > sat ? NOW : (wd === 5 ? NOW : sat), addDays(sat, 1));
    else if (q === "next") setDates(addDays(sat, 7), addDays(sat, 8));
    else if (q === "tg") setDates("2026-11-26", "2026-11-29");
    else { S.dow = ""; store.set("dow", ""); setDates("", "") }
  });
  document.getElementById("free").checked = S.free;
  document.getElementById("free").addEventListener("change", e => { S.free = e.target.checked; store.set("free", S.free); render() });
  document.getElementById("clearall").addEventListener("click", ev => {
    ev.preventDefault();
    S.regions.clear(); S.acts.clear(); store.set("acts", []); S.cat = ""; S.fam = S.kids = S.free = S.conf = S.low = false; S.q = ""; S.from = S.to = S.dow = "";
    for (const k of ["regions", "cat", "fam", "kids", "free", "conf", "low", "dow"]) store.set(k, k === "regions" ? [] : (k === "cat" || k === "dow") ? "" : false);
    for (const id of ["fam", "kidsf", "free", "conf", "low"]) document.getElementById(id).checked = false;
    document.getElementById("cat").value = ""; document.getElementById("q").value = "";
    render();
  });
  const tt = document.getElementById("totop");
  window.addEventListener("scroll", () => { tt.hidden = window.scrollY < 900 }, {passive: true});
  tt.addEventListener("click", () => jumpTo(0));
  document.getElementById("kidsf").addEventListener("change", e => { S.kids = e.target.checked; store.set("kids", S.kids); render() });
  document.getElementById("low").addEventListener("change", e => { S.low = e.target.checked; store.set("low", S.low); render() });
  let tmr; document.getElementById("q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { S.q = e.target.value.trim(); render() }, 120) });
  document.getElementById("out").addEventListener("click", ev => {
    const g = ev.target.closest("[data-goto=kids]");
    if (g) { S.view = "season"; S.kids = true; document.getElementById("kidsf").checked = true; store.set("view", S.view); store.set("kids", true); render(); jumpTo(0); return }
    const s = ev.target.closest(".star"); if (!s) return;
    const id = s.dataset.star; S.stars.has(id) ? S.stars.delete(id) : S.stars.add(id);
    store.set("stars", [...S.stars]); render();
  });
  render();
}
init();
</script>

</body>
</html>
